<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Restaurant Menu</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #fff8ee;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #c0392b;
        }

        p {
            color: #444;
        }

        .menu-image {
            width: 600px;
            max-width: 100%;
            height: auto;
            border: 4px solid #c0392b;
            border-radius: 10px;
        }

        .container {
            margin: 20px auto;
            max-width: 650px;
        }

        .note {
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <h1>🍽️ Interactive Restaurant Menu</h1>

    <p>Click on any food item in the image to explore it!</p>

    <div class="container">

        <!-- Food image with clickable image map -->
        <img
            src="https://placehold.co/600x400/fff0d9/7a2e12?text=Pizza+%7C+Burger+%7C+Fries%0ASandwich+%7C+Cake+%7C+Menu"
            alt="Restaurant menu showing pizza, burger, french fries, sandwich, cake slice and menu card"
            usemap="#restaurantmap"
            class="menu-image"
            width="600"
            height="400"
        >

        <map name="restaurantmap">

            <!-- 1. Pizza: Circle -->
            <area
                shape="circle"
                coords="100,90,55"
                href="pizza.html"
                alt="Pizza"
                title="Explore Pizza"
                target="_blank"
            >

            <!-- 2. Burger: Circle -->
            <area
                shape="circle"
                coords="300,90,55"
                href="burger.html"
                alt="Burger"
                title="Explore Burger"
                target="_blank"
            >

            <!-- 3. French Fries: Rectangle -->
            <area
                shape="rect"
                coords="420,35,570,140"
                href="fries.html"
                alt="French Fries"
                title="Explore French Fries"
                target="_blank"
            >

            <!-- 4. Menu Card: Rectangle -->
            <area
                shape="rect"
                coords="20,180,180,280"
                href="menu-card.html"
                alt="Restaurant Menu Card"
                title="View Menu Card"
                target="_blank"
            >

            <!-- 5. Sandwich: Polygon -->
            <area
                shape="poly"
                coords="210,180,350,180,390,260,250,270"
                href="sandwich.html"
                alt="Sandwich"
                title="Explore Sandwich"
                target="_blank"
            >

            <!-- 6. Cake Slice: Polygon -->
            <area
                shape="poly"
                coords="420,190,560,220,500,300,420,270"
                href="cake.html"
                alt="Cake Slice"
                title="Explore Cake Slice"
                target="_blank"
            >

            <!-- 7. Remaining area: Default -->
            <area
                shape="default"
                href="restaurant-info.html"
                alt="Other restaurant information"
                title="More Restaurant Information"
                target="_blank"
            >

        </map>
    </div>

    <p class="note">
        Tip: Click different parts of the image to open their webpages.
    </p>

</body>

</html>
