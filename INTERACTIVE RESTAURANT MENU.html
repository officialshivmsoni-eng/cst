<!DOCTYPE html>
<html>
<head>
    <title>Interactive Restaurant Menu</title>
</head>
<body>

    <h1>Interactive Restaurant Menu</h1>

    <p>Click on any food item to learn more about it.</p>

    <img src="FOOD PIC.png"
         alt="Restaurant food menu"
         width="880"
         height="447"
         usemap="#foodmap">

    <map name="foodmap">

      
        <area shape="circle"
              coords="225,85,80"
              href="https://www.justdial.com/Patiala/Italian-Pizzeria-Rajpura/9999PX175-X175-230912112109-H7C1_BZDET"
              alt="Pasta"
              target="_blank">

     
        <area shape="circle"
              coords="600,105,75"
              href="https://www.burgerking.in/"
              alt="Burger"
              target="_blank">

    
        <area shape="rect"
              coords="175,180,315,315"
              href="https://mcdelivery.co.in/"
              alt="French Fries"
              target="_blank">

     
        <area shape="rect"
              coords="750,140,875,260"
              href="https://theobroma.in/"
              alt="Chocolate Cake"
              target="_blank">

       
        <area shape="poly"
              coords="320,40,410,55,510,110,450,190,320,140"
              href="https://sandwichjunction.in/"
              alt="Sandwich"
              target="_blank">

        <area shape="poly"
              coords="300,240,350,200,430,210,490,270,470,350,380,385,310,330"
              href="https://www.pizzahut.co.in/"
              alt="Pizza"
              target="_blank">

       
        <area shape="default"
              href="default.html"
              alt="Other food items"
              target="_blank">

    </map>

</body>
</html>
